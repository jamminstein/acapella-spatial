<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Spatial audio verification</title>
<h1>Spatial audio verification</h1>
<p>Offline renders only. No sound is sent to your speakers.</p>
<button id="run">Run audio checks</button><pre id="result" role="status"></pre>
<script type="module">
import { createSpatialPanner } from '../src/spatial-audio.js';
import { listeningPosition, HOME, LIMITS } from '../src/spatial-position.js';
async function render(position) {
  const context = new OfflineAudioContext(2, 48000, 48000);
  const source = context.createBufferSource();
  const buffer = context.createBuffer(1, 48000, 48000);
  const samples = buffer.getChannelData(0);
  for (let i = 0; i < samples.length; i++) {
    samples[i] = .08 * (Math.sin(i/48000*Math.PI*880) + Math.sin(i/48000*Math.PI*2200) + Math.sin(i/48000*Math.PI*6400));
  }
  source.buffer = buffer;
  const panner = createSpatialPanner(context), p = listeningPosition(position);
  panner.positionX.value = p.x; panner.positionY.value = p.y; panner.positionZ.value = p.z;
  source.connect(panner); panner.connect(context.destination); source.start();
  const rendered = await context.startRendering();
  return [0,1].map(channel => {
    const data = rendered.getChannelData(channel).slice(4800);
    return Math.sqrt(data.reduce((sum, v) => sum + v*v, 0) / data.length);
  });
}
document.querySelector('#run').onclick = async () => {
  const output = document.querySelector('#result'); output.textContent = 'Rendering…';
  try {
    const left = await render({ ...HOME, x: -1 });
    const right = await render({ ...HOME, x: 1 });
    const near = await render({ ...HOME, z: LIMITS.z[1] });
    const far = await render({ ...HOME, z: LIMITS.z[0] });
    const energy = values => Math.hypot(...values);
    const passed = left[0] > left[1]*1.1 && right[1] > right[0]*1.1 && energy(near) > energy(far)*1.2;
    output.textContent = (passed ? 'PASS' : 'FAIL') + '\n' + JSON.stringify({ left, right, near, far }, null, 2);
  } catch (error) { output.textContent = 'FAIL\n' + error.message; }
};
</script></html>
